<!DOCTYPE html>
<html>
<head>
    <title>User Profile</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="public-profile-layout">
        <aside class="profile-sidebar">
            <h2 id="profileUserName"></h2>
            <div class="profile-info">
                <p><strong>Nationality:</strong> <span id="profileNationality"></span></p>
                <p><strong>Hometown:</strong> <span id="profileHometown"></span></p>
                <p><strong>Gender:</strong> <span id="profileGender"></span></p>
            </div>
            <button id="followButton">Follow</button>
        </aside>
        <main class="profile-stories">
            <h2>Stories</h2>
            <div id="profileStoriesContainer"></div>
        </main>
    </div>
    <script src="profile.js"></script>
</body>
</html>
